name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release/dmxorcist-${GITHUB_REF_NAME}.apk"

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmxorcist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publishing only happens on a v* tag. The APK is signed with the standard
      # Android debug key, which installs fine from a phone but is not suitable
      # for the Play Store. Add a real keystore via repository secrets if you
      # ever need that.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          draft: false
